name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts blocks dependency lifecycle scripts (SonarCloud S6505):
      # a compromised transitive package can otherwise run arbitrary code on the
      # runner at install time. Nothing here needs them — the only packages with
      # install scripts are @parcel/watcher (Jest watch mode, unused in CI),
      # fsevents (darwin-only) and unrs-resolver, whose native binding arrives
      # as a platform-specific optional dependency rather than via postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      # Informational only: surfaces advisories in the log without failing the
      # build. Dev-only moderates are triaged/dismissed in the Security tab; the
      # lint + test steps above are the real gate for Dependabot PRs. Fails the
      # step (but not the job) only on high/critical so they stay visible.
      - name: npm audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
